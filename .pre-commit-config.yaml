---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=300
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        language: system
        entry: shellcheck
        files: ^(scripts/cleanup-images\.sh|tests/cleanup-images/(run\.sh|bin/.*))$

      - id: cleanup-images
        name: cleanup-images tests
        language: system
        entry: tests/cleanup-images/run.sh
        files: ^(scripts/cleanup-images\.sh|tests/cleanup-images/.*)$
        pass_filenames: false
