---
name: 🧹 Cleanup images

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      dry-run:
        description: List what would be deleted without deleting it
        type: boolean
        default: true
      probe:
        description: Only report package and pull request access
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: 🧹 Cleanup GHCR versions
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout ws-meta
        uses: actions/checkout@v7

      - name: 🔍 Probe access
        if: inputs.probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TOKEN: ${{ secrets.KLOUD_BOT_ORG_PAT }}
        run: |
          unreadable=0
          for package in ws-server ws-server/testbench ws-server/cache workspace; do
            if gh api "/orgs/kloudkit/packages/container/${package//\//%2F}/versions?per_page=1" \
              --jq "\"✓ ${package}: versions listable\""; then
              continue
            fi
            echo "::error::${package} versions are not listable with GITHUB_TOKEN"
            unreadable=1
          done

          for repo in ws-server workspace; do
            if GH_TOKEN="${PR_TOKEN}" gh pr list --repo "kloudkit/${repo}" --state all --limit 1 \
              --json number --jq "\"✓ ${repo}: pull requests readable\""; then
              continue
            fi
            echo "::error::${repo} pull requests are not readable with KLOUD_BOT_ORG_PAT"
            unreadable=1
          done
          exit "${unreadable}"

      - name: 🔑 Login to GHCR
        if: ${{ !inputs.probe }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧹 Cleanup
        if: ${{ !inputs.probe }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TOKEN: ${{ secrets.KLOUD_BOT_ORG_PAT }}
          DRY_RUN: ${{ github.event_name == 'schedule' || inputs.dry-run }}
        run: scripts/cleanup-images.sh
